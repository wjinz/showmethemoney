<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>showmethemoney</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F4F6F8; --surface: #FFFFFF; --primary: #1C2B4A; --secondary: #7A9E87;
      --text: #111827; --muted: #6B7280; --border: #E5E7EB;
      --danger: #E8715A; --radius-lg: 24px; --radius-xl: 32px;
      --shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
    }
    html, body, #root { height: 100%; width: 100%; font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif; background: #e2e5ea; color: var(--text); overflow: hidden; }
    .phone-shell { width: 390px; height: 844px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 40px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    @media (max-width: 430px) { .phone-shell { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; } body { background: var(--bg); } }
    @media (min-height: 845px) { body { display: flex; align-items: center; justify-content: center; min-height: 100vh; } }
    .view-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 100px; }
    .view-content::-webkit-scrollbar { display: none; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: rgba(255,255,255,.93); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 8px 16px; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; cursor: pointer; padding: 8px 4px; -webkit-tap-highlight-color: transparent; }
    .nav-fab { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg,#1C2B4A,#2d4270); display: flex; align-items: center; justify-content: center; margin-top: -28px; box-shadow: 0 4px 16px rgba(28,43,74,.4); cursor: pointer; border: 4px solid var(--bg); transition: transform .15s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .nav-fab:active { transform: scale(.93); }
    .card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 20px; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 200; transition: opacity .25s; }
    .sheet { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-radius: 28px 28px 0 0; z-index: 201; max-height: 92%; display: flex; flex-direction: column; }
    .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #D1D5DB; margin: 12px auto 4px; flex-shrink: 0; }
    button { border: none; background: none; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

// ─── ICONS ────────────────────────────────────────────────────────────────────
const IcoHome = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z" fill="#9CA3AF"/><path d="M9 21V12h6v9" fill="#9CA3AF"/></svg>;

const IcoSettle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" fill="#9CA3AF"/><path d="M2 9h20" stroke="white" strokeWidth="1.5"/><rect x="5" y="13" width="4" height="2" rx="1" fill="white"/></svg>;
const IcoPlus = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" strokeWidth="2.5" strokeLinecap="round"/></svg>;
const IcoChevR = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#9CA3AF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoChevD = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#9CA3AF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoSend = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoDel = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6M12 9l6 6" stroke="#374151" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoGear = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#6B7280" strokeWidth="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="#6B7280" strokeWidth="1.8"/></svg>;
const IcoChevLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#111827" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoSosTab = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="#9CA3AF" strokeWidth="2"/><path d="M12 9v4M12 17h.01" stroke="#9CA3AF" strokeWidth="2" strokeLinecap="round"/></svg>;

// ─── BOTTOM NAV ───────────────────────────────────────────────────────────────
function BottomNav({ active, onNav, onFab }) {
  const items = [
    { id:'home', label:'홈', Ico: IcoHome },
    { id:'history', label:'내역', Ico: IcoHistory },
    { id:'fab', label:'', Ico: null },
    { id:'private', label:'프라이빗', Ico: IcoLock },
    { id:'settlement', label:'정산', Ico: IcoSettle },
  ];
  return (
    <nav className="bottom-nav">
      {items.map(item => {
        if (item.id === 'fab') return (
          <div key="fab" className="nav-fab" onClick={onFab}><IcoPlus /></div>
        );
        const on = active === item.id;
        return (
          <div key={item.id} className="nav-item" onClick={() => onNav(item.id)}>
            <item.Ico />
            <span style={{ fontSize:10, fontWeight: on ? 700 : 500, color: on ? '#1C2B4A' : '#9CA3AF' }}>{item.label}</span>
          </div>
        );
      })}
    </nav>
  );
}

// ─── BUDGET RING ──────────────────────────────────────────────────────────────
function BudgetRing({ pct }) {
  const r = 54, circ = 2 * Math.PI * r;
  const color = pct > .85 ? '#E8715A' : pct > .65 ? '#F59E0B' : '#7A9E87';
  return (
    <svg width="120" height="120" viewBox="0 0 128 128" style={{ transform:'rotate(-90deg)' }}>
      <circle cx="64" cy="64" r={r} fill="none" stroke="#E5E7EB" strokeWidth="10"/>
      <circle cx="64" cy="64" r={r} fill="none" stroke={color} strokeWidth="10"
        strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ*(1-Math.min(pct,1))}
        style={{ transition:'stroke-dashoffset .6s ease,stroke .3s' }}/>
    </svg>
  );
}

// ─── NUMPAD ───────────────────────────────────────────────────────────────────
function NumPad({ value, onChange }) {
  const keys = ['1','2','3','4','5','6','7','8','9','00','0','⌫'];
  const tap = (k) => {
    if (k === '⌫') { onChange(value.slice(0,-1) || '0'); return; }
    if (value === '0' || value === '') { onChange(k === '00' ? '0' : k); return; }
    if (value.length >= 9) return;
    onChange(value + k);
  };
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:6 }}>
      {keys.map(k => (
        <button key={k} onClick={() => tap(k)} style={{
          height:50, borderRadius:12,
          background: k==='⌫' ? '#F3F4F6' : 'transparent',
          fontSize: k==='⌫' ? 13 : 22, fontWeight:600, color:'#111827',
          display:'flex', alignItems:'center', justifyContent:'center',
          transition:'background .1s',
        }}
        onMouseDown={e=>e.currentTarget.style.background='#E5E7EB'}
        onMouseUp={e=>e.currentTarget.style.background=k==='⌫'?'#F3F4F6':'transparent'}
        >{k==='⌫' ? <IcoDel /> : k}</button>
      ))}
    </div>
  );
}

// ─── TX ROW ───────────────────────────────────────────────────────────────────
function TxRow({ tx }) {
  const [exp, setExp] = React.useState(false);
  const isMe = tx.who === 'me';
  const color = isMe ? '#1C2B4A' : '#7A9E87';
  const name = isMe ? '나' : '지연';
  return (
    <div style={{ marginBottom:8 }}>
      <div style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 1px 3px rgba(0,0,0,.06)', display:'flex', alignItems:'center', gap:10, cursor: tx.items ? 'pointer' : 'default' }}
        onClick={() => tx.items && setExp(e=>!e)}>
        <div style={{ width:4, alignSelf:'stretch', borderRadius:2, background:color, flexShrink:0 }} />
        <div style={{ flex:1 }}>
          <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:3 }}>
            <span style={{ fontSize:12, fontWeight:700, color }}>{name}</span>
            {tx.type==='daily' && <span style={{ fontSize:10, background:color+'18', color, padding:'1px 6px', borderRadius:10, fontWeight:600 }}>총액</span>}
            {tx.hidden && <span style={{ fontSize:10, background:'#F3F4F6', color:'#9CA3AF', padding:'1px 6px', borderRadius:10 }}>🔒 비공개</span>}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ fontSize:13, color:'#374151' }}>{tx.memo}</span>
            <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <span style={{ fontSize:15, fontWeight:800, color:'#111827' }}>{fmt(tx.amount)}</span>
              {tx.items && <IcoChevD />}
            </div>
          </div>
          <span style={{ fontSize:11, color:'#9CA3AF' }}>{tx.date}</span>
        </div>
      </div>
      {exp && tx.items && (
        <div style={{ background:'#F9FAFB', borderRadius:'0 0 14px 14px', padding:'10px 14px 12px 28px', marginTop:-4, borderTop:'none' }}>
          {tx.items.map((item,i) => (
            <div key={i} style={{ display:'flex', justifyContent:'space-between', padding:'3px 0' }}>
              <span style={{ fontSize:12, color:'#6B7280' }}>· {item.label}</span>
              <span style={{ fontSize:12, fontWeight:600, color:'#374151' }}>{fmt(item.amount)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── ALLOWANCE CARD ───────────────────────────────────────────────────────────
function AllowanceCard({ onNav }) {
  const allowances = [
    { name:'나', total:300000, spent:155000, color:'#1C2B4A' },
    { name:'지연', total:300000, spent:198000, color:'#7A9E87' },
  ];
  return (
    <div className="card" style={{ marginBottom:12, padding:'16px 20px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
        <p style={{ fontSize:12, color:'#9CA3AF', fontWeight:500 }}>부부 용돈 현황</p>
        <button onClick={()=>onNav('settings')} style={{ fontSize:11, color:'#7A9E87', fontWeight:600, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit' }}>설정 →</button>
      </div>
      {allowances.map((a,i) => {
        const pct = a.spent / a.total;
        const rem = a.total - a.spent;
        return (
          <div key={i} style={{ marginBottom: i < allowances.length-1 ? 14 : 0 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:6 }}>
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <div style={{ width:8, height:8, borderRadius:'50%', background:a.color }} />
                <span style={{ fontSize:13, fontWeight:600, color:'#374151' }}>{a.name}</span>
              </div>
              <div style={{ textAlign:'right' }}>
                <span style={{ fontSize:14, fontWeight:800, color:a.color }}>{fmt(rem)}</span>
                <span style={{ fontSize:11, color:'#9CA3AF' }}> 남음</span>
              </div>
            </div>
            <div style={{ height:6, borderRadius:3, background:'#F3F4F6', overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:3, width:`${Math.min(pct*100,100)}%`, background: pct>.85?'#E8715A':pct>.65?'#F59E0B':a.color, transition:'width .6s ease' }}/>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:4 }}>
              <span style={{ fontSize:10, color:'#9CA3AF' }}>사용 {fmt(a.spent)}</span>
              <span style={{ fontSize:10, color:'#9CA3AF' }}>총 {fmt(a.total)}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── MINI CALENDAR ────────────────────────────────────────────────────────────
function MiniCalendar() {
  const [selected, setSelected] = React.useState(22);
  // April 2026: starts Wednesday (3), 30 days
  const startDay = 3;
  const totalDays = 30;
  const days = ['일','월','화','수','목','금','토'];
  // spending days
  const spendDays = { 22: {me:35000,partner:28000}, 21: {me:12500,partner:67000}, 20: {me:54000,partner:89000}, 19: {me:320000,partner:0} };
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  const selectedData = spendDays[selected];

  return (
    <div className="card" style={{ marginBottom:12, padding:'16px 18px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
        <p style={{ fontSize:12, color:'#9CA3AF', fontWeight:500 }}>4월 캘린더</p>
        <span style={{ fontSize:12, fontWeight:600, color:'#1C2B4A' }}>2026년 4월</span>
      </div>
      {/* Day headers */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', marginBottom:4 }}>
        {days.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:10, fontWeight:600, color: i===0?'#E8715A':i===6?'#60A5FA':'#9CA3AF', padding:'2px 0' }}>{d}</div>)}
      </div>
      {/* Date cells */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'3px 0' }}>
        {cells.map((d,i) => {
          if (!d) return <div key={i}/>;
          const hasSpend = !!spendDays[d];
          const isToday = d === 22;
          const isSel = d === selected;
          const isWeekend = (i % 7 === 0) || (i % 7 === 6);
          return (
            <div key={i} onClick={() => setSelected(d)} style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'3px 0', cursor:hasSpend?'pointer':'default' }}>
              <div style={{
                width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                background: isSel ? '#1C2B4A' : isToday ? '#EEF2FF' : 'transparent',
                fontSize:12, fontWeight: isToday||isSel ? 700 : 400,
                color: isSel ? 'white' : isToday ? '#1C2B4A' : isWeekend ? (i%7===0?'#E8715A':'#60A5FA') : '#374151',
              }}>{d}</div>
              {hasSpend && (
                <div style={{ display:'flex', gap:2, marginTop:2 }}>
                  {spendDays[d].me > 0 && <div style={{ width:4, height:4, borderRadius:'50%', background:'#1C2B4A' }}/>}
                  {spendDays[d].partner > 0 && <div style={{ width:4, height:4, borderRadius:'50%', background:'#7A9E87' }}/>}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {/* Selected day summary */}
      {selectedData && (
        <div style={{ marginTop:12, paddingTop:12, borderTop:'1px solid #F3F4F6', display:'flex', gap:10 }}>
          {selectedData.me > 0 && (
            <div style={{ flex:1, background:'#F4F6F8', borderRadius:10, padding:'8px 10px' }}>
              <p style={{ fontSize:10, color:'#1C2B4A', fontWeight:600, marginBottom:2 }}>나</p>
              <p style={{ fontSize:14, fontWeight:800, color:'#1C2B4A' }}>{fmt(selectedData.me)}</p>
            </div>
          )}
          {selectedData.partner > 0 && (
            <div style={{ flex:1, background:'#F4F6F8', borderRadius:10, padding:'8px 10px' }}>
              <p style={{ fontSize:10, color:'#7A9E87', fontWeight:600, marginBottom:2 }}>지연</p>
              <p style={{ fontSize:14, fontWeight:800, color:'#7A9E87' }}>{fmt(selectedData.partner)}</p>
            </div>
          )}
          <div style={{ flex:1, background:'#F4F6F8', borderRadius:10, padding:'8px 10px' }}>
            <p style={{ fontSize:10, color:'#6B7280', fontWeight:600, marginBottom:2 }}>합계</p>
            <p style={{ fontSize:14, fontWeight:800, color:'#111827' }}>{fmt((selectedData.me||0)+(selectedData.partner||0))}</p>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── HOME VIEW ────────────────────────────────────────────────────────────────
function HomeView({ onOpenInput, onNav }) {
  const { budget, spent, me, partner, todayMe, todayPartner } = MOCK;
  const remaining = budget - spent;

// ─── PRIVATE VIEW ─────────────────────────────────────────────────────────────
function PrivateView({ onNav }) {
  const [unlocked, setUnlocked] = React.useState(false);
  const [pin, setPin] = React.useState('');
  const [shake, setShake] = React.useState(false);
  const CORRECT = '1234';

  const tap = (k) => {
    if (k==='⌫') { setPin(p=>p.slice(0,-1)); return; }
    if (k==='') return;
    const next = pin + k;
    setPin(next);
    if (next.length === 4) {
      if (next===CORRECT) { setTimeout(()=>setUnlocked(true), 200); }
      else { setShake(true); setTimeout(()=>{ setPin(''); setShake(false); }, 600); }
    }
  };

  if (unlocked) return (
    <div style={{ background:'#121212', minHeight:'100%', padding:'52px 16px 100px', overflowY:'auto' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24 }}>

            <IcoChevLeft />
          </button>
          <p style={{ color:'white', fontSize:20, fontWeight:800 }}>프라이빗 월렛</p>
        </div>
        <button onClick={()=>{setUnlocked(false);setPin('');}} style={{ color:'#E8715A', fontSize:12, fontWeight:600, background:'rgba(232,113,90,.15)', border:'none', cursor:'pointer', fontFamily:'inherit', padding:'6px 12px', borderRadius:20 }}>🔒 잠그기</button>
      </div>
      <div style={{ background:'linear-gradient(135deg,#1a1a1a,#2d2d2d 50%,#0a0a0a)', borderRadius:24, padding:24, marginBottom:16, position:'relative', overflow:'hidden', boxShadow:'0 20px 60px rgba(0,0,0,.6)' }}>
        <div style={{ position:'absolute', top:-30, right:-30, width:120, height:120, borderRadius:'50%', background:'rgba(232,113,90,.1)', filter:'blur(30px)' }} />
        <p style={{ color:'#9CA3AF', fontSize:11, letterSpacing:2, marginBottom:14 }}>PRIVATE WALLET</p>
        <p style={{ color:'white', fontSize:32, fontWeight:900, letterSpacing:'-1px', marginBottom:4 }}>₩312,000</p>
        <p style={{ color:'#6B7280', fontSize:12 }}>나만의 이번 달 지출</p>
        <div style={{ marginTop:20, display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
          <div><p style={{ color:'#4B5563', fontSize:10, letterSpacing:1 }}>예산</p><p style={{ color:'#9CA3AF', fontSize:14, fontWeight:700 }}>₩500,000</p></div>
          <span style={{ fontSize:22 }}>🔒</span>
        </div>
      </div>
      <p style={{ color:'#6B7280', fontSize:12, fontWeight:600, marginBottom:10 }}>나만 보이는 내역</p>
      {[{memo:'개인 보험료',amount:87000,date:'04.15'},{memo:'용돈 (부모님)',amount:100000,date:'04.01'},{memo:'헤어샵',amount:55000,date:'04.18'}].map((t,i) => (
        <div key={i} style={{ background:'#1E1E1E', borderRadius:14, padding:'12px 16px', marginBottom:8, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div><p style={{ color:'#F9FAFB', fontSize:14, fontWeight:600 }}>{t.memo}</p><p style={{ color:'#6B7280', fontSize:12 }}>{t.date}</p></div>
          <p style={{ color:'#E8715A', fontSize:15, fontWeight:700 }}>{fmt(t.amount)}</p>
        </div>
      ))}
    </div>
  );

  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];

      <div style={{ display:'flex', gap:16, marginBottom:48, animation: shake ? 'shake .4s ease' : 'none' }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ width:16, height:16, borderRadius:'50%', background: i<pin.length?(shake?'#E8715A':'white'):'#374151', transition:'background .2s' }} />
        ))}
      </div>
      <style>{`@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }`}</style>

  const [approved, setApproved] = React.useState(false);

  const send = (text) => {
    if (!text.trim()) return;
    setMsgs(m => [...m, { id:Date.now(), from:'me', text, time:'지금', amount:null }]);
    setInput('');
  };

  const approve = () => {
    setApproved(true);
    setMsgs(m => [...m, { id:Date.now(), from:'me', text:'✅ ₩45,000 승인했어!', time:'지금' }]);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:'#F4F6F8' }}>
      <div style={{ padding:'52px 16px 12px', background:'white', borderBottom:'1px solid #E5E7EB', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:38, height:38, borderRadius:'50%', background:'#7A9E87', display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700, fontSize:15 }}>지</div>
          <div><p style={{ fontSize:15, fontWeight:700, color:'#111827' }}>지연과의 SOS</p><p style={{ fontSize:11, color:'#7A9E87' }}>● 온라인</p></div>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10 }}>
        {msgs.map(msg => {
          const isMe = msg.from==='me';
          return (
            <div key={msg.id} style={{ display:'flex', flexDirection:'column', alignItems: isMe?'flex-end':'flex-start' }}>
              {!isMe && <p style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>지연</p>}
              {/* SOS request card */}
              {msg.amount && !approved && !isMe ? (
                <div style={{ background:'white', borderRadius:'18px 18px 18px 4px', padding:'14px 16px', maxWidth:'82%', boxShadow:'0 2px 8px rgba(0,0,0,.08)' }}>
                  <p style={{ fontSize:13, color:'#374151', marginBottom:10 }}>{msg.text}</p>
                  <div style={{ background:'#FFF5F3', borderRadius:12, padding:'10px 14px', border:'1px solid #FDD5CF', marginBottom:10 }}>
                    <p style={{ fontSize:11, color:'#E8715A', fontWeight:600, marginBottom:2 }}>SOS 결재 요청</p>
                    <p style={{ fontSize:24, fontWeight:900, color:'#E8715A' }}>₩{msg.amount.toLocaleString()}</p>
                  </div>
                  <button onClick={approve} style={{ width:'100%', padding:'10px 0', background:'#1C2B4A', color:'white', borderRadius:12, fontSize:14, fontWeight:700, border:'none', cursor:'pointer', fontFamily:'inherit' }}>승인하기</button>
                </div>
              ) : (
                <div style={{ background: isMe?'#1C2B4A':'white', color: isMe?'white':'#111827', borderRadius: isMe?'18px 18px 4px 18px':'18px 18px 18px 4px', padding:'10px 14px', maxWidth:'75%', fontSize:14, lineHeight:1.5, boxShadow:'0 2px 6px rgba(0,0,0,.07)' }}>
                  {msg.text}
                </div>
              )}
              <p style={{ fontSize:10, color:'#9CA3AF', marginTop:3 }}>{msg.time}</p>
            </div>
          );
        })}
      </div>

      {/* Quick amounts */}
      <div style={{ display:'flex', gap:6, padding:'8px 14px 4px', overflowX:'auto', background:'white', flexShrink:0 }}>
        {[10000,30000,50000,100000].map(a => (
          <button key={a} onClick={() => send(`₩${a.toLocaleString()} 요청해도 돼? 🥺`)} style={{ padding:'6px 12px', borderRadius:16, background:'#F3F4F6', border:'1px solid #E5E7EB', fontSize:12, fontWeight:600, color:'#374151', cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}>
            ₩{a.toLocaleString()}
          </button>
        ))}
      </div>
      <div style={{ display:'flex', gap:8, padding:'8px 14px 100px', background:'white', borderTop:'1px solid #E5E7EB', flexShrink:0 }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(input)}
          placeholder="메시지를 입력하세요..."
          style={{ flex:1, padding:'10px 14px', borderRadius:20, border:'1.5px solid #E5E7EB', fontSize:14, fontFamily:'inherit', outline:'none', background:'#F9FAFB' }}
          onFocus={e=>e.target.style.borderColor='#1C2B4A'} onBlur={e=>e.target.style.borderColor='#E5E7EB'} />
        <button onClick={()=>send(input)} style={{ width:42, height:42, borderRadius:'50%', background:'#1C2B4A', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><IcoSend/></button>
      </div>
    </div>
  );
}

// ─── SETTLEMENT VIEW ──────────────────────────────────────────────────────────
function SettlementView() {

      const c = parseInt(cash) || 0;

      <>

  return (
    <div className="view-content" style={{ padding:'0 16px' }}>
      <p style={{ fontSize:22, fontWeight:800, color:'#111827', padding:'52px 0 16px', letterSpacing:'-0.5px' }}>카드 정산</p>

      {/* Tab Toggle */}
      <div style={{ display:'flex', background:'#F3F4F6', borderRadius:14, padding:4, marginBottom:16 }}>
        {[{id:'auto',label:'📊 자동 계산'},{id:'manual',label:'✏️ 직접 입력'}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{

            boxShadow: tab===t.id?'0 1px 4px rgba(0,0,0,.1)':'none',

          }}>{t.label}</button>
        ))}
      </div>

      {tab==='auto' ? <AutoTab/> : <ManualTab/>}
    </div>
  );
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function OnboardingView({ onComplete }) {
  const [step, setStep] = React.useState(0);
  const [type, setType] = React.useState(null);       // 'couple' | 'personal'
  const [mode, setMode] = React.useState(null);       // 'join' | 'new'
  const [code, setCode] = React.useState(['','','','','','']);
  const [codeError, setCodeError] = React.useState(false);
  const [myName, setMyName] = React.useState('');
  const [partnerName, setPartnerName] = React.useState('');
  const [budget, setBudget] = React.useState('');
  const [done, setDone] = React.useState(false);
  const codeRefs = [React.useRef(),React.useRef(),React.useRef(),React.useRef(),React.useRef(),React.useRef()];

  const DEMO_CODE = 'A1B2C3';

  const handleCodeInput = (val, idx) => {
    const v = val.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const next = [...code];
    next[idx] = v.slice(-1);
    setCode(next);
    setCodeError(false);
    if (v && idx < 5) codeRefs[idx+1].current?.focus();
    if (idx === 5 && v) {
      const full = [...next].join('');
      if (full === DEMO_CODE) { setStep(5); }
      else { setCodeError(true); }
    }
  };

  const handleCodePaste = (e) => {
    const pasted = e.clipboardData.getData('text').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if (pasted.length === 6) {
      setCode(pasted.split(''));
      setCodeError(false);
      if (pasted === DEMO_CODE) setTimeout(()=>setStep(5), 100);
      else setCodeError(true);
    }
  };

  const handleDone = () => {
    setDone(true);
    setTimeout(() => onComplete({ type, myName: myName || '나', partnerName: partnerName || '파트너', budget: parseInt(budget) || 2000000 }), 1200);
  };

  // ── 공통 스타일
  const BtnPrimary = ({ children, onClick, disabled }) => (
    <button onClick={onClick} disabled={disabled} style={{ width:'100%', padding:'16px 0', background: disabled?'#E5E7EB':'linear-gradient(135deg,#1C2B4A,#2d4270)', color: disabled?'#9CA3AF':'white', borderRadius:18, fontSize:16, fontWeight:700, border:'none', cursor: disabled?'not-allowed':'pointer', fontFamily:'inherit', boxShadow: disabled?'none':'0 4px 14px rgba(28,43,74,.3)', transition:'all .2s' }}>
      {children}
    </button>
  );

  const SelectCard = ({ selected, onClick, icon, title, sub }) => (
    <div onClick={onClick} style={{ border:`2px solid ${selected?'#1C2B4A':'#E5E7EB'}`, borderRadius:20, padding:'20px', cursor:'pointer', background: selected?'#F0F3FA':'white', transition:'all .2s', display:'flex', alignItems:'flex-start', gap:14 }}>
      <div style={{ fontSize:32, flexShrink:0 }}>{icon}</div>
      <div>
        <p style={{ fontSize:15, fontWeight:700, color: selected?'#1C2B4A':'#111827', marginBottom:4 }}>{title}</p>
        <p style={{ fontSize:13, color:'#6B7280', lineHeight:1.5 }}>{sub}</p>
      </div>
      <div style={{ marginLeft:'auto', width:22, height:22, borderRadius:'50%', border:`2px solid ${selected?'#1C2B4A':'#D1D5DB'}`, background: selected?'#1C2B4A':'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        {selected && <div style={{ width:8, height:8, borderRadius:'50%', background:'white' }}/>}
      </div>
    </div>
  );

  // ── 완료 화면
  if (done) return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'white', gap:16 }}>
      <div style={{ width:80, height:80, borderRadius:'50%', background:'linear-gradient(135deg,#7A9E87,#5a8a6e)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:36 }}>✅</div>
      <p style={{ fontSize:22, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px' }}>준비 완료!</p>
      <p style={{ fontSize:14, color:'#6B7280' }}>가계부를 시작해볼게요</p>
    </div>
  );

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'white' }}>
      {/* Progress bar (steps 1~4) */}
      {step > 0 && step < 5 && (
        <div style={{ padding:'16px 24px 0', flexShrink:0 }}>
          <div style={{ height:3, background:'#F3F4F6', borderRadius:2, overflow:'hidden' }}>
            <div style={{ height:'100%', borderRadius:2, background:'#1C2B4A', width:`${(step/4)*100}%`, transition:'width .3s ease' }}/>
          </div>
        </div>
      )}

      <div style={{ flex:1, overflowY:'auto', padding:'0 24px 24px', display:'flex', flexDirection:'column' }}>

        {/* ── STEP 0: 스플래시 ── */}

          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:0 }}>
            <div style={{ width:88, height:88, borderRadius:28, background:'linear-gradient(135deg,#1C2B4A,#2d4270)', display:'flex', alignItems:'center', justifyContent:'center', marginBottom:24, boxShadow:'0 8px 32px rgba(28,43,74,.25)' }}>

            </div>
            <p style={{ fontSize:28, fontWeight:900, color:'#1C2B4A', letterSpacing:'-1px', marginBottom:8 }}>showmethemoney</p>

            <div style={{ display:'flex', gap:8, width:'100%', flexDirection:'column' }}>
              <BtnPrimary onClick={()=>setStep(1)}>시작하기</BtnPrimary>
              <button onClick={()=>{ setType('couple'); setMode('join'); setStep(3); }} style={{ width:'100%', padding:'14px 0', background:'transparent', color:'#9CA3AF', fontSize:14, fontWeight:500, border:'none', cursor:'pointer', fontFamily:'inherit' }}>
                초대 코드로 입장하기
              </button>
            </div>
          </div>
        )}

        {/* ── STEP 1: 가계부 유형 ── */}
        {step === 1 && (
          <div style={{ flex:1, paddingTop:32 }}>
            <button onClick={()=>setStep(0)} style={{ color:'#9CA3AF', fontSize:13, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', marginBottom:20, padding:0 }}>← 뒤로</button>
            <p style={{ fontSize:22, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px', marginBottom:6 }}>어떤 가계부인가요?</p>
            <p style={{ fontSize:14, color:'#6B7280', marginBottom:28, lineHeight:1.5 }}>용도에 맞게 최적화된 기능을 제공해드릴게요</p>
            <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:32 }}>
              <SelectCard selected={type==='couple'} onClick={()=>setType('couple')} icon="👫" title="부부 / 파트너 공유" sub="두 사람이 함께 예산을 관리해요. 용돈·SOS 결재·공동 지출 추적 기능이 활성화돼요."/>
              <SelectCard selected={type==='personal'} onClick={()=>setType('personal')} icon="👤" title="개인용" sub="혼자서 지출을 관리해요. 프라이빗 월렛과 AI 코치 기능을 활용할 수 있어요."/>
            </div>
            <BtnPrimary onClick={()=>{ if(type) setStep(2); }} disabled={!type}>다음</BtnPrimary>
          </div>
        )}

        {/* ── STEP 2: 입장 방식 ── */}
        {step === 2 && (
          <div style={{ flex:1, paddingTop:32 }}>
            <button onClick={()=>setStep(1)} style={{ color:'#9CA3AF', fontSize:13, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', marginBottom:20, padding:0 }}>← 뒤로</button>
            <p style={{ fontSize:22, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px', marginBottom:6 }}>어떻게 시작할까요?</p>
            <p style={{ fontSize:14, color:'#6B7280', marginBottom:28 }}>기존 가계부에 합류하거나 새로 만들 수 있어요</p>
            <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:32 }}>
              <SelectCard selected={mode==='join'} onClick={()=>setMode('join')} icon="🔗" title="초대 코드로 입장" sub="파트너가 보내준 6자리 코드로 기존 가계부에 합류해요."/>
              <SelectCard selected={mode==='new'} onClick={()=>setMode('new')} icon="✨" title="새 가계부 만들기" sub="처음부터 새로운 가계부를 만들고 파트너를 초대해요."/>
            </div>
            <BtnPrimary onClick={()=>{ if(mode) setStep(mode==='join'?3:4); }} disabled={!mode}>다음</BtnPrimary>
          </div>
        )}

        {/* ── STEP 3: 초대 코드 입력 ── */}
        {step === 3 && (
          <div style={{ flex:1, paddingTop:32 }}>
            <button onClick={()=>setStep(2)} style={{ color:'#9CA3AF', fontSize:13, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', marginBottom:20, padding:0 }}>← 뒤로</button>
            <p style={{ fontSize:22, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px', marginBottom:6 }}>초대 코드 입력</p>
            <p style={{ fontSize:14, color:'#6B7280', marginBottom:8 }}>파트너에게 받은 6자리 코드를 입력하세요</p>
            <p style={{ fontSize:12, color:'#7A9E87', marginBottom:28, fontWeight:600 }}>데모 코드: A1B2C3</p>
            <div style={{ display:'flex', gap:8, justifyContent:'center', marginBottom:12 }} onPaste={handleCodePaste}>
              {code.map((c,i) => (
                <input key={i} ref={codeRefs[i]} value={c} maxLength={1}
                  onChange={e=>handleCodeInput(e.target.value,i)}
                  onKeyDown={e=>{ if(e.key==='Backspace'&&!c&&i>0) codeRefs[i-1].current?.focus(); }}
                  style={{ width:44, height:54, textAlign:'center', fontSize:22, fontWeight:800, borderRadius:14, border:`2px solid ${codeError?'#E8715A':c?'#1C2B4A':'#E5E7EB'}`, outline:'none', fontFamily:'inherit', color:'#1C2B4A', textTransform:'uppercase', background: c?'#F0F3FA':'white', transition:'border-color .15s' }}
                  onFocus={e=>!codeError&&(e.target.style.borderColor='#1C2B4A')}
                  onBlur={e=>!c&&!codeError&&(e.target.style.borderColor='#E5E7EB')}/>
              ))}
            </div>
            {codeError && <p style={{ textAlign:'center', fontSize:13, color:'#E8715A', fontWeight:600, marginBottom:16 }}>코드가 일치하지 않아요. 다시 확인해주세요.</p>}
            <div style={{ marginTop:20 }}>
              <BtnPrimary onClick={()=>{ const full=code.join(''); if(full===DEMO_CODE) setStep(5); else setCodeError(true); }} disabled={code.join('').length<6}>입장하기</BtnPrimary>
            </div>
          </div>
        )}

        {/* ── STEP 4: 신규 설정 ── */}
        {step === 4 && (
          <div style={{ flex:1, paddingTop:32 }}>
            <button onClick={()=>setStep(2)} style={{ color:'#9CA3AF', fontSize:13, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', marginBottom:20, padding:0 }}>← 뒤로</button>
            <p style={{ fontSize:22, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px', marginBottom:6 }}>기본 설정</p>
            <p style={{ fontSize:14, color:'#6B7280', marginBottom:28 }}>나중에 설정에서 언제든 바꿀 수 있어요</p>
            <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:32 }}>
              <div>
                <p style={{ fontSize:12, fontWeight:700, color:'#374151', marginBottom:6 }}>내 이름</p>
                <input placeholder="이름을 입력해주세요" value={myName} onChange={e=>setMyName(e.target.value)}
                  style={{ width:'100%', padding:'13px 16px', borderRadius:14, border:'1.5px solid #E5E7EB', fontSize:15, fontFamily:'inherit', outline:'none', transition:'border-color .15s' }}
                  onFocus={e=>e.target.style.borderColor='#1C2B4A'} onBlur={e=>e.target.style.borderColor='#E5E7EB'}/>
              </div>
              {type === 'couple' && (
                <div>
                  <p style={{ fontSize:12, fontWeight:700, color:'#374151', marginBottom:6 }}>파트너 이름</p>
                  <input placeholder="파트너 이름을 입력해주세요" value={partnerName} onChange={e=>setPartnerName(e.target.value)}
                    style={{ width:'100%', padding:'13px 16px', borderRadius:14, border:'1.5px solid #E5E7EB', fontSize:15, fontFamily:'inherit', outline:'none', transition:'border-color .15s' }}
                    onFocus={e=>e.target.style.borderColor='#7A9E87'} onBlur={e=>e.target.style.borderColor='#E5E7EB'}/>
                </div>
              )}
              <div>
                <p style={{ fontSize:12, fontWeight:700, color:'#374151', marginBottom:6 }}>월 예산</p>
                <div style={{ position:'relative' }}>
                  <span style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', color:'#9CA3AF', fontSize:15 }}>₩</span>
                  <input placeholder="2,000,000" value={budget?parseInt(budget).toLocaleString():''} onChange={e=>setBudget(e.target.value.replace(/\D/g,''))}
                    style={{ width:'100%', padding:'13px 16px 13px 30px', borderRadius:14, border:'1.5px solid #E5E7EB', fontSize:15, fontFamily:'inherit', outline:'none', transition:'border-color .15s' }}
                    onFocus={e=>e.target.style.borderColor='#1C2B4A'} onBlur={e=>e.target.style.borderColor='#E5E7EB'}/>
                </div>
              </div>
              {type === 'couple' && (
                <div style={{ background:'#F9FAFB', borderRadius:14, padding:'12px 14px', border:'1px solid #E5E7EB' }}>
                  <p style={{ fontSize:12, fontWeight:600, color:'#374151', marginBottom:2 }}>📤 초대 코드가 생성돼요</p>
                  <p style={{ fontSize:12, color:'#9CA3AF', lineHeight:1.5 }}>가계부 생성 후 파트너에게 코드를 공유하면 함께 시작할 수 있어요</p>
                </div>
              )}
            </div>
            <BtnPrimary onClick={()=>setStep(5)} disabled={!myName}>다음</BtnPrimary>
          </div>
        )}

        {/* ── STEP 5: 완료 ── */}
        {step === 5 && (
          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:16 }}>
            <div style={{ width:80, height:80, borderRadius:'50%', background:'linear-gradient(135deg,#1C2B4A,#2d4270)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:36, boxShadow:'0 8px 32px rgba(28,43,74,.25)' }}>🎉</div>
            <div>
              <p style={{ fontSize:24, fontWeight:900, color:'#1C2B4A', letterSpacing:'-0.5px', marginBottom:6 }}>
                {mode==='join' ? '합류 완료!' : '가계부 생성 완료!'}
              </p>
              <p style={{ fontSize:14, color:'#6B7280', lineHeight:1.6 }}>
                {mode==='join' ? '공유 가계부에 합류했어요' : `${myName||'나'}의 가계부가 준비됐어요`}
              </p>
            </div>
            {mode==='new' && type==='couple' && (
              <div style={{ background:'#F0F3FA', borderRadius:16, padding:'14px 18px', width:'100%', border:'1px solid #C7D2FE' }}>
                <p style={{ fontSize:11, color:'#6B7280', marginBottom:6 }}>파트너 초대 코드</p>
                <p style={{ fontSize:28, fontWeight:900, color:'#1C2B4A', letterSpacing:4 }}>X7K9M2</p>
                <p style={{ fontSize:11, color:'#9CA3AF', marginTop:4 }}>파트너에게 공유해주세요</p>
              </div>
            )}
            <div style={{ width:'100%', marginTop:8 }}>
              <BtnPrimary onClick={handleDone}>시작하기 →</BtnPrimary>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

              <input placeholder="금액" value={newAmt} onChange={e=>setNewAmt(e.target.value.replace(/\D/g,''))}

                onFocus={e=>e.target.style.borderColor='#1C2B4A'} onBlur={e=>e.target.style.borderColor='#E5E7EB'}/>

          </div>
        )}
      </div>
    </div>
  );
}

          <p style={{ fontSize:30, fontWeight:900, color:'#1C2B4A', letterSpacing:'-1px', marginBottom:4 }}>{fmt(total)}</p>
          <div style={{ height:8, borderRadius:4, background:'#F3F4F6', overflow:'hidden', marginBottom:8 }}>

              <div key={i} style={{ height:'100%', width:`${s.w}%`, background:s.c, display:'inline-block' }}/>

          <div style={{ display:'flex', justifyContent:'space-between' }}>
            <span style={{ fontSize:12, color:'#9CA3AF' }}>배분 완료 {fmt(allocated)}</span>
            <span style={{ fontSize:12, fontWeight:700, color: free>=0?'#7A9E87':'#E8715A' }}>여유 {free>=0?'+':''}{fmt(free)}</span>

            <SettingRow key={i} label={item.label} sub={item.sub} icon={item.icon} border={i<items.length-1}
              right={<span style={{ fontSize:14, fontWeight:700, color:item.color }}>{fmt(item.amount)}</span>}/>
          ))}
        </SettingSection>

        <div style={{ background:'#F9FAFB', borderRadius:16, padding:'14px 16px', border:'1px solid #E5E7EB' }}>
          <p style={{ fontSize:12, color:'#9CA3AF', marginBottom:6 }}>💡 플랜 인사이트</p>
          <p style={{ fontSize:13, color:'#374151', lineHeight:1.6 }}>고정비 비율이 예산의 <strong>45%</strong>를 차지하고 있어요. 절약 여지는 카드 결제 예상액인 <strong>{fmt(820000)}</strong>에서 생길 수 있어요.</p>
        </div>
      </div>
    </div>
  );
}

      <p style={{ textAlign:'center', fontSize:12, color:'#9CA3AF', padding:'4px 0 28px' }}>showmethemoney v4.0.0</p>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [onboarded, setOnboarded] = React.useState(() => !!localStorage.getItem('smtm_onboarded'));
  const [view, setView] = React.useState(() => localStorage.getItem('smtm_view') || 'home');
  const [sheetOpen, setSheetOpen] = React.useState(false);
  const [sheetVis, setSheetVis] = React.useState(false);

  const handleOnboardComplete = (data) => {
    localStorage.setItem('smtm_onboarded', '1');
    if (data.myName) localStorage.setItem('smtm_myname', data.myName);
    setOnboarded(true);
  };

  const navigate = (v) => { setView(v); localStorage.setItem('smtm_view', v); };
  const openSheet = () => { setSheetOpen(true); setTimeout(()=>setSheetVis(true), 10); };
  const closeSheet = () => { setSheetVis(false); setTimeout(()=>setSheetOpen(false), 280); };

  if (!onboarded) return (
    <div className="phone-shell">
      <OnboardingView onComplete={handleOnboardComplete} />
    </div>
  );

  const views = {
    home: <HomeView onOpenInput={openSheet} onNav={navigate}/>,
    history: <HistoryView/>,
    private: <PrivateView onNav={navigate}/>,
    sos: <SOSView/>,
    settlement: <SettlementView/>,
    settings: <SettingsView onNav={navigate} onReset={()=>{ localStorage.removeItem('smtm_onboarded'); localStorage.removeItem('smtm_view'); setView('home'); setOnboarded(false); }}/>,
  };

  return (
    <div className="phone-shell">
      <div style={{ flex:1, position:'relative', overflow:'hidden', display:'flex', flexDirection:'column' }}>
        {views[view] || views.home}
      </div>
      <BottomNav active={view} onNav={navigate} onFab={openSheet} />
      {sheetOpen && (
        <>
          <div className="overlay" style={{ opacity:sheetVis?1:0 }} onClick={closeSheet} />
          <div className="sheet" style={{ transform:sheetVis?'translateY(0)':'translateY(100%)', transition:'transform .28s cubic-bezier(.32,0,.67,0)', height:'88%' }}>
            <InputSheet onClose={closeSheet} />
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
