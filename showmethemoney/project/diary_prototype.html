<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부부 다이어리 — showmethemoney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FAF7F3; --cream2: #F4EFE8; --cream3: #EDE5D8;
  --ink: #1C1714; --ink2: #5C4F44; --ink3: #9C8E84;
  --h-color: oklch(42% 0.10 230); --h-light: oklch(92% 0.06 230); --h-mid: oklch(75% 0.10 230);
  --w-color: oklch(52% 0.14 10);  --w-light: oklch(94% 0.06 10);  --w-mid: oklch(78% 0.12 10);
  --accent: oklch(58% 0.14 50); --green: oklch(55% 0.14 150);
  --nav-h: 72px; --status-h: 50px;
}
html, body { height: 100%; background: #1a1a1a; font-family: 'Noto Sans KR', sans-serif; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

/* ── Phone Shell ── */
.phone {
  width: 390px; height: 844px; background: var(--cream); border-radius: 50px;
  box-shadow: 0 40px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.15);
  overflow: hidden; position: relative; display: flex; flex-direction: column;
}
.status-bar {
  height: var(--status-h); background: var(--cream);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0; position: relative; z-index: 10;
}
.status-bar .time { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -.3px; }
.status-bar .icons { display: flex; gap: 6px; align-items: center; }
.notch {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; background: #0d0d0d; border-radius: 20px;
}
.screen { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.nav-bar {
  height: var(--nav-h); background: rgba(250,247,243,.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--cream3);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px 8px; flex-shrink: 0; position: relative; z-index: 20;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; padding: 8px 12px; border-radius: 14px;
  transition: all .2s ease; flex: 1; border: none; background: none; font-family: inherit;
}
.nav-item.active { background: var(--cream2); }
.nav-item span { font-size: 10px; font-weight: 500; color: var(--ink3); }
.nav-item.active span { color: var(--ink2); font-weight: 600; }
.nav-fab {
  width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: white;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; font-family: inherit;
  box-shadow: 0 4px 16px rgba(28,23,20,.25); transition: transform .15s ease; flex-shrink: 0;
}
.nav-fab:active { transform: scale(.93); }

/* ── View ── */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.view-header {
  padding: 14px 20px 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.view-header h1 { font-size: 21px; font-weight: 700; color: var(--ink); letter-spacing: -.5px; }
.view-header .sub { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.scroll-area { flex: 1; overflow-y: auto; padding: 0 16px 20px; -webkit-overflow-scrolling: touch; }
.scroll-area::-webkit-scrollbar { display: none; }

/* ── Month Banner ── */
.month-banner {
  margin: 0 16px 10px; border-radius: 18px;
  background: var(--ink); color: white; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.mb-left .mb-label { font-size: 11px; opacity: .5; letter-spacing: .5px; }
.mb-left .mb-amount { font-size: 20px; font-weight: 700; letter-spacing: -1px; margin-top: 1px; }
.mb-left .mb-sub { font-size: 11px; opacity: .6; margin-top: 2px; }

/* ── Calendar ── */
.cal-wrap {
  margin: 0 16px 10px; border-radius: 18px; background: white;
  border: 1px solid var(--cream3); overflow: hidden; flex-shrink: 0;
  transition: all .3s ease;
}
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; cursor: pointer;
}
.cal-header .cal-month { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
.cal-header .cal-toggle {
  width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--cream2);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform .25s ease;
}
.cal-header .cal-toggle.open { transform: rotate(180deg); }
.cal-body { padding: 0 12px 12px; }
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; margin-bottom: 4px;
}
.cal-weekdays span { font-size: 10px; font-weight: 600; color: var(--ink3); padding: 4px 0; }
.cal-weekdays span:first-child { color: var(--w-color); }
.cal-weekdays span:last-child { color: var(--h-color); }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 2px; border-radius: 10px; cursor: pointer;
  transition: background .15s ease; min-height: 46px;
}
.cal-day:hover { background: var(--cream2); }
.cal-day.selected { background: var(--ink); }
.cal-day.today .cal-day-num {
  background: var(--ink); color: white; width: 24px; height: 24px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.cal-day.selected .cal-day-num { background: white !important; color: var(--ink) !important; }
.cal-day-num { font-size: 13px; font-weight: 500; color: var(--ink); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.cal-day.empty .cal-day-num { color: transparent; }
.cal-day.sunday .cal-day-num { color: var(--w-color); }
.cal-day.saturday .cal-day-num { color: var(--h-color); }
.cal-day.today .cal-day-num { color: white; }
.cal-day.other-month .cal-day-num { color: var(--cream3); }
.cal-dots { display: flex; gap: 2px; justify-content: center; min-height: 6px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-dot.h { background: var(--h-mid); }
.cal-dot.w { background: var(--w-mid); }
.cal-dot.photo { background: var(--accent); }

/* ── Diary Cards ── */
.day-group { margin-bottom: 24px; }
.day-label {
  font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: .8px;
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.day-label::after { content: ''; flex: 1; height: 1px; background: var(--cream3); }
.diary-card {
  border-radius: 18px; padding: 15px; margin-bottom: 8px;
  position: relative; overflow: hidden; background: white;
  border: 1px solid var(--cream3); box-shadow: 0 2px 12px rgba(28,23,20,.05);
}
.diary-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px;
}
.diary-card.husband::before { background: var(--h-mid); }
.diary-card.wife::before   { background: var(--w-mid); }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
}
.avatar.husband { background: var(--h-light); }
.avatar.wife    { background: var(--w-light); }
.card-meta { flex: 1; }
.card-name { font-size: 13px; font-weight: 600; color: var(--ink2); }
.card-time { font-size: 11px; color: var(--ink3); }
.card-mood { font-size: 20px; }
.card-content { font-size: 14px; color: var(--ink); line-height: 1.6; letter-spacing: -.2px; }

/* ── Photo Strip in Card ── */
.photo-strip {
  display: flex; gap: 6px; margin-top: 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.photo-strip::-webkit-scrollbar { display: none; }
.photo-thumb {
  width: 80px; height: 80px; border-radius: 12px; flex-shrink: 0;
  object-fit: cover; cursor: pointer; border: 1px solid var(--cream3);
  transition: transform .12s ease;
}
.photo-thumb:active { transform: scale(.96); }
.photo-placeholder {
  width: 80px; height: 80px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; border: 1px solid var(--cream3);
}

.card-footer {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--cream2);
  display: flex; align-items: center; justify-content: space-between;
}
.spend-badge { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink3); }
.spend-badge strong { font-size: 13px; font-weight: 600; color: var(--ink2); }
.shared-tag { font-size: 10px; font-weight: 600; letter-spacing: .3px; padding: 3px 8px; border-radius: 20px; }
.shared-tag.shared  { background: oklch(94% 0.08 150); color: oklch(38% 0.12 150); }
.shared-tag.private { background: var(--cream2); color: var(--ink3); }

/* ── Today Prompt ── */
.today-prompt {
  border-radius: 18px; padding: 14px; border: 1.5px dashed var(--cream3);
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  transition: background .15s ease; margin-bottom: 8px;
}
.today-prompt:hover { background: var(--cream2); }
.prompt-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.prompt-text { font-size: 13px; color: var(--ink3); }
.prompt-text strong { color: var(--ink2); font-weight: 600; display: block; }

/* ── Input Sheet ── */
.sheet-backdrop {
  position: absolute; inset: 0; background: rgba(28,23,20,.35);
  backdrop-filter: blur(6px); z-index: 100;
  display: flex; align-items: flex-end; animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes slideUp { from { transform:translateY(100%) } to { transform:translateY(0) } }
.sheet {
  width: 100%; background: var(--cream); border-radius: 24px 24px 0 0;
  padding: 0 0 32px; animation: slideUp .3s cubic-bezier(.32,0,.15,1);
  max-height: 92%; overflow-y: auto;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--cream3); margin: 12px auto 18px; }
.sheet-title { font-size: 17px; font-weight: 700; color: var(--ink); padding: 0 20px; margin-bottom: 18px; letter-spacing: -.3px; }
.who-selector { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 16px; }
.who-btn {
  flex: 1; padding: 10px; border-radius: 14px; border: 1.5px solid var(--cream3);
  background: white; cursor: pointer; text-align: center; font-family: inherit;
  transition: all .15s ease; font-size: 13px; font-weight: 600; color: var(--ink3);
}
.who-btn.selected.h { border-color: var(--h-mid); background: var(--h-light); color: var(--h-color); }
.who-btn.selected.w { border-color: var(--w-mid); background: var(--w-light); color: var(--w-color); }
.emoji-row {
  display: flex; gap: 6px; padding: 0 20px; margin-bottom: 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.emoji-row::-webkit-scrollbar { display: none; }
.emoji-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--cream3);
  background: white; font-size: 19px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: all .15s ease;
}
.emoji-btn.selected { border-color: var(--accent); background: oklch(97% 0.04 50); }
.sheet-input {
  margin: 0 20px 14px; padding: 13px 15px; border-radius: 14px;
  border: 1.5px solid var(--cream3); background: white; font-family: inherit;
  font-size: 14px; color: var(--ink); resize: none; width: calc(100% - 40px);
  outline: none; line-height: 1.55; transition: border-color .15s ease;
}
.sheet-input:focus { border-color: var(--accent); }
.sheet-input::placeholder { color: var(--ink3); }

/* ── Photo Picker in Sheet ── */
.photo-picker-area { padding: 0 20px; margin-bottom: 16px; }
.photo-picker-label { font-size: 12px; font-weight: 600; color: var(--ink3); letter-spacing: .3px; margin-bottom: 8px; }
.photo-picker-row { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.photo-picker-row::-webkit-scrollbar { display: none; }
.photo-add-btn {
  width: 72px; height: 72px; border-radius: 14px; border: 1.5px dashed var(--cream3);
  background: var(--cream2); display: flex; flex-direction: column; align-items: center;
  justify-content: center; cursor: pointer; flex-shrink: 0; gap: 4px; font-family: inherit;
  transition: background .15s ease;
}
.photo-add-btn:hover { background: var(--cream3); }
.photo-add-btn span { font-size: 10px; color: var(--ink3); }
.photo-preview-thumb {
  width: 72px; height: 72px; border-radius: 14px; object-fit: cover;
  flex-shrink: 0; border: 1px solid var(--cream3); position: relative; cursor: pointer;
}
.photo-preview-wrap { position: relative; flex-shrink: 0; }
.photo-preview-del {
  position: absolute; top: -4px; right: -4px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--ink); color: white; border: none;
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: inherit; line-height: 1;
}

.spend-row {
  display: flex; align-items: center; gap: 10px; padding: 0 20px; margin-bottom: 16px;
}
.spend-row label { font-size: 13px; color: var(--ink3); flex-shrink: 0; }
.spend-input {
  flex: 1; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--cream3);
  background: white; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
  outline: none; text-align: right; transition: border-color .15s ease;
}
.spend-input:focus { border-color: var(--accent); }
.spend-suffix { font-size: 14px; color: var(--ink3); flex-shrink: 0; }
.privacy-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; margin-bottom: 20px;
}
.toggle {
  width: 44px; height: 26px; border-radius: 13px; background: var(--cream3);
  border: none; cursor: pointer; position: relative; transition: background .2s ease;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%; background: white;
  box-shadow: 0 1px 4px rgba(0,0,0,.15); transition: transform .2s ease;
}
.toggle.on::after { transform: translateX(18px); }
.sheet-submit {
  margin: 0 20px; width: calc(100% - 40px); padding: 15px; border-radius: 16px;
  background: var(--ink); color: white; font-family: inherit; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; letter-spacing: -.2px; transition: transform .12s ease;
}
.sheet-submit:active { transform: scale(.97); }

/* ── Mode Selector ── */
.mode-tabs { display: flex; gap: 0; margin: 0 20px 20px; border-radius: 16px; background: var(--cream2); padding: 4px; }
.mode-tab {
  flex: 1; padding: 10px; border-radius: 12px; border: none; background: none;
  font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink3);
  cursor: pointer; transition: all .18s ease; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.mode-tab.active { background: white; color: var(--ink); box-shadow: 0 1px 6px rgba(28,23,20,.10); }

/* ── Expense Items ── */
.expense-total-display {
  margin: 0 20px 18px; padding: 16px 18px; border-radius: 18px;
  background: var(--ink); color: white; text-align: center;
}
.expense-total-display .etd-label { font-size: 11px; opacity: .5; letter-spacing: .5px; margin-bottom: 4px; }
.expense-total-display .etd-amount { font-size: 28px; font-weight: 700; letter-spacing: -1.5px; }
.expense-total-display .etd-count { font-size: 11px; opacity: .5; margin-top: 3px; }

.expense-items-list { padding: 0 20px; margin-bottom: 14px; }
.expense-items-label { font-size: 12px; font-weight: 600; color: var(--ink3); letter-spacing: .3px; margin-bottom: 8px; }
.expense-item-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  background: white; border: 1px solid var(--cream3); border-radius: 14px; padding: 10px 12px;
}
.expense-item-label-input {
  flex: 1; border: none; background: none; font-family: inherit;
  font-size: 14px; color: var(--ink); outline: none; min-width: 0;
}
.expense-item-label-input::placeholder { color: var(--ink3); }
.expense-item-divider { width: 1px; height: 16px; background: var(--cream3); flex-shrink: 0; }
.expense-item-amount-input {
  width: 90px; border: none; background: none; font-family: inherit;
  font-size: 14px; font-weight: 600; color: var(--ink); outline: none;
  text-align: right; flex-shrink: 0;
}
.expense-item-amount-input::placeholder { color: var(--ink3); font-weight: 400; }
.expense-item-del {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  background: var(--cream2); color: var(--ink3); font-size: 14px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-family: inherit; transition: background .12s ease;
}
.expense-item-del:hover { background: var(--cream3); }
.add-item-btn {
  width: 100%; padding: 11px; border-radius: 14px; border: 1.5px dashed var(--cream3);
  background: none; font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--ink3); cursor: pointer; transition: background .15s ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.add-item-btn:hover { background: var(--cream2); }

/* ── Expense Card items list ── */
.expense-items-in-card {
  margin-top: 10px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--cream2);
}
.expense-item-in-card {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--cream2);
}
.expense-item-in-card:last-child { border-bottom: none; }
.expense-item-in-card .ei-label { color: var(--ink2); }
.expense-item-in-card .ei-amount { font-weight: 600; color: var(--ink); }

/* ── Detail Sheet ── */
.detail-sheet {
  width: 100%; background: var(--cream); border-radius: 24px 24px 0 0;
  animation: slideUp .3s cubic-bezier(.32,0,.15,1);
  max-height: 95%; display: flex; flex-direction: column;
}
.detail-sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 20px 14px; flex-shrink: 0;
}
.detail-sheet-header .dsh-title { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -.4px; }
.detail-sheet-header .dsh-del {
  font-size: 12px; font-weight: 600; color: var(--w-color);
  border: none; background: none; cursor: pointer; font-family: inherit;
  padding: 6px 10px; border-radius: 10px; background: var(--w-light);
}
.detail-sheet-body { flex: 1; overflow-y: auto; padding: 0 20px 8px; }
.detail-sheet-body::-webkit-scrollbar { display: none; }
.detail-sheet-footer { padding: 12px 20px 28px; flex-shrink: 0; display: flex; gap: 10px; }
.detail-sheet-footer .btn-cancel {
  flex: 1; padding: 14px; border-radius: 16px; border: 1.5px solid var(--cream3);
  background: white; font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--ink2); cursor: pointer;
}
.detail-sheet-footer .btn-save {
  flex: 2; padding: 14px; border-radius: 16px; border: none;
  background: var(--ink); font-family: inherit; font-size: 14px; font-weight: 600;
  color: white; cursor: pointer; transition: transform .12s ease;
}
.detail-sheet-footer .btn-save:active { transform: scale(.97); }

.field-label { font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: .4px; margin-bottom: 8px; }
.field-block { margin-bottom: 18px; }
.who-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
}
.who-chip.h { background: var(--h-light); color: var(--h-color); }
.who-chip.w { background: var(--w-light); color: var(--w-color); }
.detail-divider { height: 1px; background: var(--cream3); margin: 18px 0; }

/* ── Lightbox ── */
.lightbox {
  position: absolute; inset: 0; background: rgba(0,0,0,.9);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  animation: fadeIn .15s ease; cursor: pointer;
}

/* ─── Helpers ─── */
function fmtMoney(n) { return n ? '₩' + n.toLocaleString('ko-KR') : '₩0'; }
function groupByDate(items) {
  const map = {};
  items.forEach(item => { if(!map[item.date]) map[item.date]=[]; map[item.date].push(item); });
  return Object.entries(map).sort((a,b) => b[0] > a[0] ? 1 : -1);
}
function dateLabel(dateStr) {
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date(TODAY+'T00:00:00');
  const diff = Math.round((today-d)/86400000);
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  const mm = d.getMonth()+1, dd = d.getDate();
  if(diff===0) return `오늘 · ${mm}월 ${dd}일 ${wd}요일`;
  if(diff===1) return `어제 · ${mm}월 ${dd}일 ${wd}요일`;
  return `${mm}월 ${dd}일 ${wd}요일`;
}

/* ─── Budget Ring ─── */
function BudgetRing({ spent, budget, size=90 }) {
  const pct = Math.min(spent/budget, 1);
  const r=36, circ=2*Math.PI*r;
  const color = pct>.85 ? 'oklch(55% 0.18 25)' : pct>.65 ? 'var(--accent)' : 'var(--green)';
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx="50" cy="50" r={r} fill="none" stroke="var(--cream2)" strokeWidth="10"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="10"
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
        strokeLinecap="round" transform="rotate(-90 50 50)"
        style={{transition:'stroke-dashoffset .8s ease'}}/>
      <text x="50" y="53" textAnchor="middle" fontSize="18" fontWeight="700"
        fill="var(--ink)" fontFamily="Noto Sans KR">{Math.round(pct*100)}%</text>
    </svg>
  );
}

/* ─── Mini Calendar ─── */
function MiniCalendar({ diaries, selectedDate, onSelectDate }) {
  const [open, setOpen] = useState(true);

  // Build April 2026 grid
  const year=2026, month=3; // 0-indexed April
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Map date → who has entries
  const entryMap = {};
  diaries.forEach(d => {
    if(d.date.startsWith('2026-04')) {
      const dd = parseInt(d.date.slice(8));
      if(!entryMap[dd]) entryMap[dd] = {h:false, w:false, photo:false};
      if(d.who==='husband') entryMap[dd].h = true;
      if(d.who==='wife') entryMap[dd].w = true;
      if(d.photos && d.photos.length>0) entryMap[dd].photo = true;
    }
  });

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const todayDay = parseInt(TODAY.slice(8));
  const selectedDay = selectedDate ? parseInt(selectedDate.slice(8)) : null;

  function handleDay(d) {
    if(!d) return;
    const dateStr = `2026-04-${String(d).padStart(2,'0')}`;
    if(selectedDate === dateStr) onSelectDate(null);
    else onSelectDate(dateStr);
  }

  return (
    <div className="cal-wrap">
      <div className="cal-header" onClick={()=>setOpen(v=>!v)}>
        <span className="cal-month">2026년 4월</span>
        <div className={`cal-toggle${open?' open':''}`}><ChevronDown/></div>
      </div>
      {open && (
        <div className="cal-body">
          <div className="cal-weekdays">
            {['일','월','화','수','목','금','토'].map(w=><span key={w}>{w}</span>)}
          </div>
          <div className="cal-days">
            {cells.map((d, i) => {
              const isToday = d===todayDay;
              const isSel = d !== null && d === selectedDay;
              const isWeekend = i%7===0 ? 'sunday' : i%7===6 ? 'saturday' : '';
              const e = d ? entryMap[d] : null;
              return (
                <div
                  key={i}
                  className={`cal-day${!d?' empty':''}${isToday?' today':''}${isSel?' selected':''}${isWeekend?' '+isWeekend:''}`}
                  onClick={()=>handleDay(d)}
                >
                  <div className="cal-day-num">{d || ''}</div>
                  {e && (
                    <div className="cal-dots">
                      {e.h && <div className="cal-dot h"></div>}
                      {e.w && <div className="cal-dot w"></div>}
                      {e.photo && <div className="cal-dot photo"></div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

  return (

      onClick={isMine ? onCardClick : undefined}
      style={{cursor: isMine ? 'pointer' : 'default'}}>

        <div className={`avatar ${isH?'husband':'wife'}`}>{isH?'👨':'👩'}</div>

          <div className="card-name">{isH?'우진':'지연'}{!isMine && <span style={{fontSize:10,color:'var(--ink3)',marginLeft:4,fontWeight:400}}>파트너</span>}</div>
          <div className="card-time">{item.time}</div>
        </div>
        <div className="card-mood">{item.emoji}</div>
      </div>

      {/* 내용: 다이어리는 항상 표시, 지출은 본인만 메모 표시 */}
      {(!isExpense || isMine) && (
        <div className="card-content">{item.content}</div>
      )}

      {/* 지출 항목: 본인만 */}
      {isExpense && isMine && item.expenseItems && item.expenseItems.length > 0 && (
        <div className="expense-items-in-card" style={{marginTop:10}}>
          {item.expenseItems.map((ei,idx)=>(
            <div className="expense-item-in-card" key={idx}>
              <span className="ei-label">{ei.label}</span>
              <span className="ei-amount">{fmtMoney(ei.amount)}</span>
            </div>
          ))}
        </div>
      )}

      {/* 사진: 본인만 */}
      {isMine && item.photos && item.photos.length > 0 && (
        <div className="photo-strip">
          {item.photos.map((src,idx)=>(
            <img key={idx} className="photo-thumb" src={src} alt=""
              onClick={e=>{e.stopPropagation(); onPhotoClick(src);}}/>
          ))}

      )}

      <div className="card-footer">
        <div className="spend-badge">
          <WalletIcon/>
          {item.totalSpent > 0
            ? <><span>지출 </span><strong>{fmtMoney(item.totalSpent)}</strong></>
            : <span style={{color:'var(--ink3)'}}>지출 없음</span>
          }
          {/* 파트너 지출엔 '비공개' 힌트 */}
          {isExpense && !isMine && (
            <span style={{fontSize:10,color:'var(--ink3)',marginLeft:4}}>· 세부 비공개</span>
          )}

        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {isMine && (
            <span style={{fontSize:10,fontWeight:600,color:'var(--accent)',padding:'3px 8px',borderRadius:20,background:'oklch(97% 0.04 50)'}}>수정</span>
          )}
          <span className={`shared-tag ${item.shared?'shared':'private'}`}>
            {item.shared?'공유 중':'비공개'}
          </span>
        </div>
      </div>
    </div>
  );
}

  /* diary state */
  const [emoji, setEmoji] = useState('😊');
  const [content, setContent] = useState('');
  const [shared, setShared] = useState(true);
  const [photos, setPhotos] = useState([]);
  const fileRef = useRef();

  /* expense state */
  const [items, setItems] = useState([newItem()]);
  const [memo, setMemo] = useState('');
  const [expShared, setExpShared] = useState(true);

  const expTotal = items.reduce((s,i) => s + (parseInt(String(i.amount).replace(/[^0-9]/g,''))||0), 0);

  function handleFiles(e) {
    Array.from(e.target.files).forEach(file => {
      const r = new FileReader();
      r.onload = ev => setPhotos(p => [...p, ev.target.result]);
      r.readAsDataURL(file);
    });
    e.target.value = '';
  }
  function removePhoto(idx) { setPhotos(p => p.filter((_,i)=>i!==idx)); }

  function updateItem(id, field, val) {
    setItems(prev => prev.map(it => it.id===id ? {...it,[field]:val} : it));
  }
  function removeItem(id) { setItems(prev => prev.length>1 ? prev.filter(it=>it.id!==id) : prev); }
  function addItem() { setItems(prev => [...prev, newItem()]); }

  function handleSave() {
    if(mode==='diary') {
      if(!content.trim()) return;
      onSave({ id:Date.now(), date:TODAY, who, emoji, content:content.trim(),
        totalSpent:0, shared, photos, type:'diary',
        time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
      });
    } else {
      const validItems = items.filter(it => it.label.trim() || parseInt(String(it.amount).replace(/[^0-9]/g,'')) > 0)
        .map(it => ({ label: it.label.trim()||'항목', amount: parseInt(String(it.amount).replace(/[^0-9]/g,''))||0 }));
      if(!validItems.length) return;
      onSave({ id:Date.now(), date:TODAY, who, emoji:'💳', content:memo.trim()||'지출 기록',
        totalSpent:expTotal, shared:expShared, photos:[], type:'expense',
        expenseItems: validItems,
        time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
      });
    }
    onClose();
  }

  return (
    <div className="sheet-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet">
        <div className="sheet-handle"></div>

        {/* Mode Tabs */}
        <div className="mode-tabs">
          <button className={`mode-tab${mode==='diary'?' active':''}`} onClick={()=>setMode('diary')}>
            <span>✏️</span> 다이어리
          </button>
          <button className={`mode-tab${mode==='expense'?' active':''}`} onClick={()=>setMode('expense')}>
            <span>💳</span> 지출 입력
          </button>
        </div>

        {/* Who */}
        <div className="who-selector">
          <button className={`who-btn${who==='husband'?' selected h':''}`} onClick={()=>setWho('husband')}>👨 우진</button>
          <button className={`who-btn${who==='wife'?' selected w':''}`} onClick={()=>setWho('wife')}>👩 지연</button>
        </div>

        {/* ── DIARY MODE ── */}
        {mode==='diary' && (<>
          <div className="emoji-row">
            {EMOJIS.map(e=>(
              <button key={e} className={`emoji-btn${emoji===e?' selected':''}`} onClick={()=>setEmoji(e)}>{e}</button>
            ))}
          </div>
          <textarea className="sheet-input" rows={3}
            placeholder="오늘 하루는 어땠나요? 🥺"
            value={content} onChange={e=>setContent(e.target.value)}/>
          <div className="photo-picker-area">
            <div className="photo-picker-label">사진 첨부</div>
            <div className="photo-picker-row">
              <button className="photo-add-btn" onClick={()=>fileRef.current.click()}>
                <CameraIcon/><span>추가</span>
              </button>
              <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={handleFiles}/>
              {photos.map((src,idx)=>(
                <div className="photo-preview-wrap" key={idx}>
                  <img className="photo-preview-thumb" src={src} alt=""/>
                  <button className="photo-preview-del" onClick={()=>removePhoto(idx)}>×</button>
                </div>
              ))}
            </div>
          </div>
          <div className="privacy-row">
            <div>
              <div style={{fontSize:13,color:'var(--ink2)',fontWeight:500}}>파트너와 공유</div>
              <div style={{fontSize:11,color:'var(--ink3)'}}>다이어리 내용 공유</div>
            </div>
            <button className={`toggle${shared?' on':''}`} onClick={()=>setShared(v=>!v)}></button>
          </div>
        </>)}

        {/* ── EXPENSE MODE ── */}
        {mode==='expense' && (<>
          {/* Running Total */}
          <div className="expense-total-display">
            <div className="etd-label">합계 금액</div>
            <div className="etd-amount">{fmtMoney(expTotal)}</div>
            <div className="etd-count">{items.filter(it=>parseInt(String(it.amount).replace(/[^0-9]/g,''))>0).length}개 항목</div>
          </div>

          {/* Items List */}
          <div className="expense-items-list">
            <div className="expense-items-label">지출 항목</div>
            {items.map(it=>(
              <div className="expense-item-row" key={it.id}>
                <input className="expense-item-label-input" type="text"
                  placeholder="항목명 (예: 점심, 카페)"
                  value={it.label} onChange={e=>updateItem(it.id,'label',e.target.value)}/>
                <div className="expense-item-divider"></div>
                <input className="expense-item-amount-input" type="text" inputMode="numeric"
                  placeholder="금액"
                  value={it.amount} onChange={e=>updateItem(it.id,'amount',e.target.value)}/>
                <button className="expense-item-del" onClick={()=>removeItem(it.id)}>×</button>
              </div>
            ))}
            <button className="add-item-btn" onClick={addItem}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              항목 추가
            </button>
          </div>

          {/* Optional memo */}
          <textarea className="sheet-input" rows={2}
            placeholder="메모 (선택사항) — 오늘 어디서 썼나요?"
            value={memo} onChange={e=>setMemo(e.target.value)}/>

          <div className="privacy-row">
            <div>
              <div style={{fontSize:13,color:'var(--ink2)',fontWeight:500}}>파트너와 총액 공유</div>
              <div style={{fontSize:11,color:'var(--ink3)'}}>개별 항목은 비공개 · 합계만 공유</div>
            </div>
            <button className={`toggle${expShared?' on':''}`} onClick={()=>setExpShared(v=>!v)}></button>
          </div>
        </>)}

        <button className="sheet-submit"
          onClick={handleSave}
          style={{opacity: mode==='diary'&&!content.trim() ? .45 : mode==='expense'&&expTotal===0 ? .45 : 1}}>
          저장하기
        </button>
      </div>
    </div>
  );
}

/* ─── Detail Sheet ─── */
function DetailSheet({ item, onClose, onSave, onDelete }) {
  const isH = item.who === 'husband';
  const [emoji, setEmoji] = useState(item.emoji);
  const [content, setContent] = useState(item.content);
  const [shared, setShared] = useState(item.shared);
  const [photos, setPhotos] = useState(item.photos || []);
  const [items, setItems] = useState(
    item.expenseItems ? item.expenseItems.map((it,i)=>({...it, id:i+1})) : []
  );
  const fileRef = useRef();

  const expTotal = items.reduce((s,it)=>s+(parseInt(String(it.amount).replace(/[^0-9]/g,''))||0),0);
  const isExpense = item.type === 'expense';

  function updateItem(id, field, val) { setItems(prev=>prev.map(it=>it.id===id?{...it,[field]:val}:it)); }
  function removeItem(id) { setItems(prev=>prev.length>1?prev.filter(it=>it.id!==id):prev); }
  function addItem() { setItems(prev=>[...prev,{id:Date.now(),label:'',amount:''}]); }

  function handleFiles(e) {
    Array.from(e.target.files).forEach(file=>{
      const r=new FileReader();
      r.onload=ev=>setPhotos(p=>[...p,ev.target.result]);
      r.readAsDataURL(file);
    });
    e.target.value='';
  }

  function handleSave() {
    const validItems = items
      .filter(it=>it.label.trim()||(parseInt(String(it.amount).replace(/[^0-9]/g,''))||0)>0)
      .map(it=>({label:it.label.trim()||'항목',amount:parseInt(String(it.amount).replace(/[^0-9]/g,''))||0}));
    onSave({
      ...item, emoji, content, shared, photos,
      expenseItems: isExpense ? validItems : undefined,
      totalSpent: isExpense ? expTotal : item.totalSpent,
    });
    onClose();
  }

  function handleDelete() {
    if(window.confirm('이 기록을 삭제할까요?')) { onDelete(item.id); onClose(); }
  }

  return (
    <div className="sheet-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="detail-sheet">
        {/* Header */}
        <div className="detail-sheet-header">
          <div className="dsh-title">기록 수정</div>
          <button className="dsh-del" onClick={handleDelete}>삭제</button>
        </div>

        <div className="detail-sheet-body">
          {/* Who + type badge */}
          <div className="field-block" style={{display:'flex',alignItems:'center',gap:10}}>
            <div className={`who-chip ${isH?'h':'w'}`}>{isH?'👨 우진':'👩 지연'}</div>
            <div style={{fontSize:12,fontWeight:600,color:'var(--ink3)',padding:'5px 10px',borderRadius:20,background:'var(--cream2)'}}>
              {isExpense?'💳 지출':'✏️ 다이어리'} · {item.time}
            </div>
          </div>

          <div className="detail-divider"></div>

          {/* Emoji */}
          {!isExpense && (
            <div className="field-block">
              <div className="field-label">기분</div>
              <div className="emoji-row" style={{padding:0,marginBottom:0}}>
                {EMOJIS.map(e=>(
                  <button key={e} className={`emoji-btn${emoji===e?' selected':''}`} onClick={()=>setEmoji(e)}>{e}</button>
                ))}
              </div>
            </div>
          )}

          {/* Content */}
          <div className="field-block">
            <div className="field-label">{isExpense?'메모':'일기 내용'}</div>
            <textarea className="sheet-input" style={{margin:0,width:'100%'}} rows={3}
              placeholder={isExpense?'메모 (선택사항)':'오늘 하루는 어땠나요?'}
              value={content} onChange={e=>setContent(e.target.value)}/>
          </div>

          {/* Expense items */}
          {isExpense && (
            <div className="field-block">
              <div className="field-label">지출 항목</div>
              <div style={{marginBottom:8,padding:'12px 14px',borderRadius:14,background:'var(--ink)',color:'white',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:12,opacity:.6}}>합계</span>
                <span style={{fontSize:18,fontWeight:700,letterSpacing:'-1px'}}>{fmtMoney(expTotal)}</span>
              </div>
              {items.map(it=>(
                <div className="expense-item-row" key={it.id}>
                  <input className="expense-item-label-input" type="text" placeholder="항목명"
                    value={it.label} onChange={e=>updateItem(it.id,'label',e.target.value)}/>
                  <div className="expense-item-divider"></div>
                  <input className="expense-item-amount-input" type="text" inputMode="numeric" placeholder="금액"
                    value={it.amount} onChange={e=>updateItem(it.id,'amount',e.target.value)}/>
                  <button className="expense-item-del" onClick={()=>removeItem(it.id)}>×</button>
                </div>
              ))}
              <button className="add-item-btn" onClick={addItem}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          )}

          {/* Photos */}
          <div className="field-block">
            <div className="field-label">사진</div>
            <div className="photo-picker-row">
              <button className="photo-add-btn" onClick={()=>fileRef.current.click()}>
                <CameraIcon/><span>추가</span>
              </button>
              <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={handleFiles}/>
              {photos.map((src,idx)=>(
                <div className="photo-preview-wrap" key={idx}>
                  <img className="photo-preview-thumb" src={src} alt=""/>
                  <button className="photo-preview-del" onClick={()=>setPhotos(p=>p.filter((_,i)=>i!==idx))}>×</button>
                </div>
              ))}
            </div>
          </div>

          <div className="detail-divider"></div>

          {/* Shared toggle */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <div>
              <div style={{fontSize:13,color:'var(--ink2)',fontWeight:500}}>파트너와 공유</div>
              <div style={{fontSize:11,color:'var(--ink3)'}}>{isExpense?'총액만 공유':'다이어리 내용 공유'}</div>

          </div>
        </div>

        <div className="detail-sheet-footer">
          <button className="btn-cancel" onClick={onClose}>취소</button>
          <button className="btn-save" onClick={handleSave}>저장하기</button>
        </div>
      </div>
    </div>
  );
}

            <div style={{fontSize:11,color:'var(--ink3)',marginBottom:3}}>이번 달 예상 지출</div>

            <div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>
              {projected>BUDGET
                ? <span style={{color:'var(--w-color)'}}>▲ {fmtMoney(projected-BUDGET)} 초과 예상</span>
                : <span style={{color:'var(--green)'}}>▼ {fmtMoney(BUDGET-projected)} 절약 예상</span>}
            </div>
          </div>
        </div>

        {/* ── 내 지출 내역 ── */}
        <div className="widget" style={{padding:0,overflow:'hidden'}}>
          {/* Header */}
          <div style={{padding:'16px 18px 14px',borderBottom:'1px solid var(--cream2)'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div className="widget-title" style={{marginBottom:0}}>
                {isH?'👨':'👩'} 내 지출 내역
              </div>
              <div style={{
                fontSize:13,fontWeight:700,letterSpacing:'-.5px',
                color: isH?'var(--h-color)':'var(--w-color)'
              }}>{fmtMoney(myTotal)}</div>
            </div>
            <div style={{fontSize:11,color:'var(--ink3)',marginTop:4}}>
              {isH?'우진':'지연'}의 지출 {myRecords.length}건 · 항목 합계 · 파트너에게 비공개
            </div>
          </div>

          {/* List */}
          {myRecords.length === 0 && (
            <div style={{padding:'28px 18px',textAlign:'center',color:'var(--ink3)',fontSize:13}}>
              아직 지출 기록이 없어요
            </div>
          )}
          {(() => {
            // 날짜별 그룹핑
            const grouped = {};
            myRecords.forEach(d => { if(!grouped[d.date]) grouped[d.date]=[]; grouped[d.date].push(d); });
            const dates = Object.keys(grouped).sort((a,b)=>b>a?1:-1);
            return dates.map(date => {
              const dayItems = grouped[date];
              const dayTotal = dayItems.reduce((s,d)=>s+(d.totalSpent||0),0);
              const dd = new Date(date+'T00:00:00');
              const wd = ['일','월','화','수','목','금','토'][dd.getDay()];
              const dayLabel = `${dd.getMonth()+1}/${dd.getDate()} (${wd})`;
              return (
                <div key={date}>
                  {/* Date header */}
                  <div style={{
                    display:'flex',justifyContent:'space-between',alignItems:'center',
                    padding:'8px 18px',background:'var(--cream2)',
                  }}>
                    <span style={{fontSize:11,fontWeight:700,color:'var(--ink3)',letterSpacing:'.3px'}}>{dayLabel}</span>
                    <span style={{fontSize:12,fontWeight:700,color:'var(--ink2)'}}>{fmtMoney(dayTotal)}</span>
                  </div>
                  {/* Items */}
                  {dayItems.map((d, idx) => {
                    const isExpanded = expandedId === d.id;
                    const hasItems = d.expenseItems && d.expenseItems.length > 0;
                    const isLast = idx === dayItems.length-1;
                    return (
                      <div key={d.id} style={{borderBottom: !isLast?'1px solid var(--cream2)':'none'}}>
                        <div
                          style={{display:'flex',alignItems:'center',gap:12,padding:'11px 18px',cursor:'pointer'}}
                          onClick={()=>setExpandedId(isExpanded?null:d.id)}
                        >
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:600,color:'var(--ink)'}}>
                              {d.content || '지출 기록'}
                            </div>
                            <div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>
                              {d.time} · {hasItems ? d.expenseItems.length+'개 항목' : '항목 없음'}
                            </div>
                          </div>
                          <div style={{textAlign:'right',flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:14,fontWeight:700,color:'var(--ink)',letterSpacing:'-.5px'}}>{fmtMoney(d.totalSpent)}</span>
                            {hasItems && <span style={{fontSize:11,color:'var(--ink3)'}}>{isExpanded?'▲':'▼'}</span>}
                          </div>
                        </div>
                        {isExpanded && (
                          <div style={{margin:'0 18px 10px',borderRadius:12,overflow:'hidden',border:'1px solid var(--cream2)'}}>
                            {hasItems && d.expenseItems.map((ei,i)=>(
                              <div key={i} style={{
                                display:'flex',justifyContent:'space-between',alignItems:'center',
                                padding:'9px 14px',borderBottom:i<d.expenseItems.length-1?'1px solid var(--cream2)':'none',
                                fontSize:13
                              }}>
                                <span style={{color:'var(--ink2)'}}>{ei.label}</span>
                                <span style={{fontWeight:600,color:'var(--ink)'}}>{fmtMoney(ei.amount)}</span>
                              </div>
                            ))}
                            <div style={{padding:'8px 14px',background:'var(--cream2)',display:'flex',justifyContent:'flex-end'}}>
                              <button onClick={()=>setDetailItem(d)} style={{
                                fontSize:12,fontWeight:600,color:'var(--accent)',border:'none',
                                background:'none',cursor:'pointer',fontFamily:'inherit'
                              }}>✏️ 수정하기</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            });
          })()}
        </div>

        {/* Category breakdown */}
        <div className="widget">
          <div className="widget-title">카테고리별 지출</div>
          {[
            {label:'식비',amt:423000,color:'var(--w-mid)'},
            {label:'마트/생활',amt:312000,color:'var(--h-mid)'},
            {label:'교통',amt:156000,color:'var(--accent)'},
            {label:'카페/외식',amt:198000,color:'var(--green)'},
            {label:'기타',amt:114500,color:'var(--cream3)'},
          ].map(c=>(
            <div key={c.label} style={{marginBottom:11}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:13,color:'var(--ink2)'}}>{c.label}</span>
                <span style={{fontSize:13,fontWeight:600,color:'var(--ink)'}}>{fmtMoney(c.amt)}</span>
              </div>
              <div className="pace-bar" style={{height:6}}>
                <div style={{height:'100%',borderRadius:6,background:c.color,width:`${c.amt/SPENT*100}%`,transition:'width .6s ease'}}></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Detail Sheet */}
      {detailItem && (
        <DetailSheet
          item={detailItem}
          onClose={()=>setDetailItem(null)}
          onSave={updated=>{onEditItem(updated); setDetailItem(null);}}
          onDelete={id=>{onDeleteItem(id); setDetailItem(null);}}
        />
      )}
    </div>
  );
}

/* ─── History View ─── */

  const dayEntries = selectedDate ? diaries.filter(d=>d.date===selectedDate) : [];
  const dayExpenses = dayEntries.filter(d=>d.type==='expense');
  const dayDiaries  = dayEntries.filter(d=>d.type==='diary');
  const dayTotal    = dayExpenses.reduce((s,d)=>s+(d.totalSpent||0),0);

  // 월간 리포트 계산
  const expenses = diaries.filter(d=>d.type==='expense');
  const totalSpent = expenses.reduce((s,d)=>s+(d.totalSpent||0),0);
  const hTotal = expenses.filter(d=>d.who==='husband').reduce((s,d)=>s+(d.totalSpent||0),0);
  const wTotal = expenses.filter(d=>d.who==='wife').reduce((s,d)=>s+(d.totalSpent||0),0);

  // 주별 집계 (4/1~7, 4/8~14, 4/15~21, 4/22~30)
  const weeks = [
    {label:'1주',s:'2026-04-01',e:'2026-04-07'},
    {label:'2주',s:'2026-04-08',e:'2026-04-14'},
    {label:'3주',s:'2026-04-15',e:'2026-04-21'},
    {label:'4주',s:'2026-04-22',e:'2026-04-30'},
  ].map(w=>({
    ...w,
    total: expenses.filter(d=>d.date>=w.s&&d.date<=w.e).reduce((s,d)=>s+(d.totalSpent||0),0)
  }));
  const maxWeek = Math.max(...weeks.map(w=>w.total), 1);

  // 일별 지출 (상위 3일)
  const byDate = {};
  expenses.forEach(d=>{ byDate[d.date]=(byDate[d.date]||0)+(d.totalSpent||0); });
  const top3Days = Object.entries(byDate).sort((a,b)=>b[1]-a[1]).slice(0,3);

  // 다이어리 이모지 분포
  const emojiMap = {};
  diaries.filter(d=>d.type==='diary').forEach(d=>{ if(d.emoji) emojiMap[d.emoji]=(emojiMap[d.emoji]||0)+1; });
  const topEmojis = Object.entries(emojiMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return (
    <div className="view">
      <div className="view-header">
        <div><h1>내역</h1></div>
      </div>

      {/* Inner tabs */}
      <div style={{display:'flex',gap:0,margin:'0 16px 12px',borderRadius:16,background:'var(--cream2)',padding:'3px',flexShrink:0}}>
        <button onClick={()=>setInnerTab('calendar')} style={{
          flex:1,padding:'9px',borderRadius:13,border:'none',cursor:'pointer',fontFamily:'inherit',
          fontSize:13,fontWeight:600,transition:'all .15s',
          background:innerTab==='calendar'?'white':'none',
          color:innerTab==='calendar'?'var(--ink)':'var(--ink3)',
          boxShadow:innerTab==='calendar'?'0 1px 6px rgba(28,23,20,.08)':'none'
        }}>📅 캘린더</button>
        <button onClick={()=>setInnerTab('report')} style={{
          flex:1,padding:'9px',borderRadius:13,border:'none',cursor:'pointer',fontFamily:'inherit',
          fontSize:13,fontWeight:600,transition:'all .15s',
          background:innerTab==='report'?'white':'none',
          color:innerTab==='report'?'var(--ink)':'var(--ink3)',
          boxShadow:innerTab==='report'?'0 1px 6px rgba(28,23,20,.08)':'none'
        }}>📊 월간 리포트</button>
      </div>

      {/* ── 캘린더 탭 ── */}
      {innerTab==='calendar' && (<>

          {!selectedDate && (
            <div style={{textAlign:'center',padding:'32px 0',color:'var(--ink3)',fontSize:13}}>
              <div style={{fontSize:36,marginBottom:8}}>📅</div>

          {selectedDate && (<>

            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>

              {dayTotal>0 && <div style={{fontSize:13,fontWeight:700,color:'var(--accent)'}}>{fmtMoney(dayTotal)}</div>}
            </div>

            {dayEntries.length===0 && (
              <div style={{textAlign:'center',padding:'28px 0',color:'var(--ink3)',fontSize:13}}>

                          {' · '}{d.time}
                        </div>
                        {isMine && <div style={{fontSize:12,color:'var(--ink3)',marginTop:2}}>{d.content}</div>}

                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:15,fontWeight:700,color:'var(--ink)',letterSpacing:'-.5px'}}>{fmtMoney(d.totalSpent)}</div>

                      </div>
                    </div>
                    {/* 본인만 항목 목록 표시 */}
                    {isMine && d.expenseItems && d.expenseItems.map((ei,i)=>(
                      <div key={i} style={{

                    {isMine && (

                        <button onClick={()=>setDetailItem(d)} style={{fontSize:12,fontWeight:600,color:'var(--accent)',border:'none',background:'none',cursor:'pointer',fontFamily:'inherit'}}>✏️ 수정하기</button>
                      </div>

                );
              })}
            </>)}

            {/* Diary entries */}
            {dayDiaries.length>0 && (<>
              <div style={{fontSize:11,fontWeight:700,color:'var(--ink3)',letterSpacing:'.5px',marginTop:4,marginBottom:8}}>다이어리</div>
              {dayDiaries.map(d=>(
                <div key={d.id} style={{
                  background:'white',borderRadius:14,border:'1px solid var(--cream3)',
                  padding:'12px 14px',marginBottom:8,
                  borderLeft:`4px solid ${d.who==='husband'?'var(--h-mid)':'var(--w-mid)'}`
                }}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                    <span style={{fontSize:18}}>{d.emoji}</span>
                    <span style={{fontSize:13,fontWeight:600,color:'var(--ink2)'}}>{d.who==='husband'?'우진':'지연'}</span>

            <div style={{fontSize:28,fontWeight:700,letterSpacing:'-1.5px'}}>{fmtMoney(totalSpent)}</div>
            <div style={{display:'flex',gap:16,marginTop:12}}>
              <div>
                <div style={{fontSize:10,opacity:.5}}>예산</div>
                <div style={{fontSize:14,fontWeight:600}}>{fmtMoney(BUDGET)}</div>
              </div>
              <div>
                <div style={{fontSize:10,opacity:.5}}>잔여</div>

                <div style={{fontSize:10,opacity:.5}}>달성률</div>

            <div className="couple-split">
              <div className="split-item h-split">
                <div className="split-name">👨 우진</div>
                <div className="split-amt">{fmtMoney(hTotal)}</div>
                <div className="split-pct">{totalSpent>0?Math.round(hTotal/totalSpent*100):0}%</div>

              const wd=['일','월','화','수','목','금','토'][d.getDay()];
              return (
                <div key={date} style={{display:'flex',alignItems:'center',gap:10,marginBottom:i<2?10:0}}>
                  <div style={{
                    width:24,height:24,borderRadius:50,
                    background:i===0?'var(--ink)':i===1?'var(--ink2)':'var(--cream3)',
                    color:i<2?'white':'var(--ink3)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:12,fontWeight:700,flexShrink:0

                  <div style={{flex:1,fontSize:13,color:'var(--ink2)'}}>
                    {d.getMonth()+1}월 {d.getDate()}일 ({wd})
                  </div>
                  <div style={{fontSize:14,fontWeight:700,color:'var(--ink)',letterSpacing:'-.5px'}}>{fmtMoney(amt)}</div>

              );
            })}
          </div>

          {/* 다이어리 무드 */}
          {topEmojis.length>0 && (
            <div className="widget">
              <div className="widget-title">이번 달 우리의 기분</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {topEmojis.map(([emoji,cnt])=>(
                  <div key={emoji} style={{
                    display:'flex',alignItems:'center',gap:5,
                    padding:'6px 12px',borderRadius:20,background:'var(--cream2)',

                  }}>
                    <span style={{fontSize:18}}>{emoji}</span>
                    <span style={{fontWeight:600,color:'var(--ink2)'}}>{cnt}회</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      )}
      {detailItem && (
        <DetailSheet
          item={detailItem}
          onClose={()=>setDetailItem(null)}
          onSave={updated=>{onEditItem(updated); setDetailItem(null);}}
          onDelete={id=>{onDeleteItem(id); setDetailItem(null);}}
        />
      )}
    </div>
  );
}

/* ─── Settlement Sheet ─── */
function SettlementSheet({ diaries, onClose }) {
  const expenses = diaries.filter(d=>d.type==='expense');
  const hTotal = expenses.filter(d=>d.who==='husband').reduce((s,d)=>s+(d.totalSpent||0),0);
  const wTotal = expenses.filter(d=>d.who==='wife').reduce((s,d)=>s+(d.totalSpent||0),0);
  const totalSpent = hTotal + wTotal;
  const fair = Math.round(totalSpent / 2);
  const diff = hTotal - wTotal;
  const payer   = diff > 0 ? '우진' : '지연';
  const receiver = diff > 0 ? '지연' : '우진';
  const amount   = Math.abs(Math.round(diff / 2));
  const [settled, setSettled] = useState(false);

  return (
    <div className="sheet-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet">
        <div className="sheet-handle"></div>
        <div className="sheet-title">4월 정산하기 💰</div>

        {/* 각자 지출 */}
        <div style={{padding:'0 20px',marginBottom:16}}>
          <div className="couple-split">
            <div className="split-item h-split">
              <div className="split-name">👨 우진</div>
              <div className="split-amt">{fmtMoney(hTotal)}</div>
              <div className="split-pct">{totalSpent>0?Math.round(hTotal/totalSpent*100):0}%</div>
            </div>
            <div className="split-item w-split">
              <div className="split-name">👩 지연</div>
              <div className="split-amt">{fmtMoney(wTotal)}</div>
              <div className="split-pct">{totalSpent>0?Math.round(wTotal/totalSpent*100):0}%</div>
            </div>
          </div>
        </div>

        {/* 합계 */}
        <div style={{margin:'0 20px 16px',padding:'14px 16px',borderRadius:16,background:'var(--cream2)'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:13,color:'var(--ink3)'}}>이번 달 총 지출</span>
            <span style={{fontSize:14,fontWeight:700,color:'var(--ink)'}}>{fmtMoney(totalSpent)}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontSize:13,color:'var(--ink3)'}}>1인당 공평 분담</span>
            <span style={{fontSize:14,fontWeight:700,color:'var(--ink)'}}>{fmtMoney(fair)}</span>
          </div>
        </div>

        {/* 정산 결과 */}
        {amount > 0 && !settled && (
          <div style={{
            margin:'0 20px 20px',padding:'18px',borderRadius:18,
            background: diff>0?'var(--h-light)':'var(--w-light)',
            border:`1.5px solid ${diff>0?'var(--h-mid)':'var(--w-mid)'}`
          }}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--ink3)',marginBottom:8}}>정산 결과</div>
            <div style={{fontSize:15,color:'var(--ink2)',lineHeight:1.6}}>
              <strong style={{color:'var(--ink)'}}>{payer}</strong>이(가) {' '}
              <strong style={{color:'var(--ink)'}}>{receiver}</strong>에게 {' '}
              <strong style={{
                fontSize:20,color:diff>0?'var(--h-color)':'var(--w-color)',letterSpacing:'-.5px'
              }}>{fmtMoney(amount)}</strong>{' '}
              을 이체하면 돼요
            </div>
          </div>
        )}
        {settled && (
          <div style={{
            margin:'0 20px 20px',padding:'18px',borderRadius:18,
            background:'oklch(94% 0.08 150)',border:'1.5px solid oklch(80% 0.10 150)',
            textAlign:'center'
          }}>
            <div style={{fontSize:24,marginBottom:6}}>✅</div>
            <div style={{fontSize:14,fontWeight:600,color:'oklch(38% 0.12 150)'}}>정산 완료!</div>
            <div style={{fontSize:12,color:'oklch(50% 0.10 150)',marginTop:3}}>4월 정산이 완료되었어요</div>
          </div>
        )}

        {!settled && (
          <button className="sheet-submit" onClick={()=>setSettled(true)}>
            정산 완료 표시
          </button>
        )}
        {settled && (
          <button className="sheet-submit" style={{background:'var(--ink3)'}} onClick={onClose}>
            닫기
          </button>
        )}
      </div>
    </div>
  );
}

/* ─── Settings View ─── */
function SettingsView({ diaries }) {
  const [showSettlement, setShowSettlement] = useState(false);
  const items = [
    {label:'월간 정산',sub:'이번 달 부부 지출 정산하기',icon:'💰',action:()=>setShowSettlement(true)},
    {label:'예산 관리',sub:'월 예산 ₩1,800,000',icon:'🎯'},
    {label:'고정 지출',sub:'월세, 보험, 구독 등',icon:'📌'},
    {label:'카드 관리',sub:'2개 등록됨',icon:'💳'},
    {label:'보안 설정',sub:'PIN 변경',icon:'🔒'},
    {label:'파트너 초대',sub:'초대 코드 공유',icon:'👫'},
    {label:'데이터 초기화',sub:'전체 또는 선택 삭제',icon:'🗑️',danger:true},
  ];
  return (
    <div className="view">
      <div className="view-header"><h1>설정</h1></div>
      <div className="scroll-area">
        {/* 정산 하이라이트 카드 */}
        <div style={{
          borderRadius:20,background:'var(--ink)',color:'white',
          padding:'16px 18px',marginBottom:16,cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'space-between'
        }} onClick={()=>setShowSettlement(true)}>
          <div>
            <div style={{fontSize:11,opacity:.5,letterSpacing:'.4px',marginBottom:4}}>이번 달</div>
            <div style={{fontSize:16,fontWeight:700}}>💰 월간 정산하기</div>
            <div style={{fontSize:12,opacity:.6,marginTop:3}}>부부 지출 차액 계산 및 정산</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        {items.slice(1).map(item=>(
          <div key={item.label} onClick={item.action} style={{
            padding:'15px 18px',background:'white',borderRadius:16,marginBottom:8,
            border:'1px solid var(--cream3)',display:'flex',justifyContent:'space-between',
            alignItems:'center',cursor:'pointer'
          }}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <span style={{fontSize:18}}>{item.icon}</span>
              <div>
                <div style={{fontSize:15,fontWeight:600,color:item.danger?'var(--w-color)':'var(--ink)'}}>{item.label}</div>
                <div style={{fontSize:12,color:'var(--ink3)',marginTop:2}}>{item.sub}</div>
              </div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        ))}
      </div>
      {showSettlement && <SettlementSheet diaries={diaries} onClose={()=>setShowSettlement(false)}/>}
    </div>
  );
}

/* ─── App ─── */
function App() {
  const [tab, setTab] = useState('diary');
  const [sheet, setSheet] = useState(null);
  const [diaries, setDiaries] = useState(SAMPLE_DIARIES);
  const [currentUser, setCurrentUser] = useState('husband');

  function openSheet(who) { setSheet(who || 'husband'); }
  function handleSave(entry) { setDiaries(prev=>[entry,...prev]); }
  function handleEdit(updated) { setDiaries(prev=>prev.map(d=>d.id===updated.id?updated:d)); }
  function handleDelete(id) { setDiaries(prev=>prev.filter(d=>d.id!==id)); }

  return (
    <div className="phone">
      <div className="status-bar">
        <div className="notch"></div>
        <div className="time">9:41</div>
        <div className="icons"><SignalIcon/><BatteryIcon/></div>
      </div>
      <div className="screen">
        {tab==='diary'     && <DiaryView diaries={diaries} onOpenSheet={openSheet} onEditItem={handleEdit} onDeleteItem={handleDelete} currentUser={currentUser}/>}
        {tab==='history'   && <HistoryView diaries={diaries} currentUser={currentUser} onEditItem={handleEdit} onDeleteItem={handleDelete}/>}
        {tab==='dashboard' && <DashboardView diaries={diaries} currentUser={currentUser} onSetUser={setCurrentUser} onEditItem={handleEdit} onDeleteItem={handleDelete}/>}
        {tab==='settings'  && <SettingsView diaries={diaries}/>}
        {sheet && <InputSheet defaultWho={sheet} onClose={()=>setSheet(null)} onSave={handleSave}/>}
      </div>
      <NavBar tab={tab} setTab={setTab} onFab={()=>openSheet('husband')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
